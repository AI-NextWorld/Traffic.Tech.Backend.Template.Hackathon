name: Build and Push to ACR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod

env:
  REPOSITORY_NAME: traffic-tech-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set environment based on input
      id: set-env
      run: |
        ENVIRONMENT="${{ github.event.inputs.environment }}"
        echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_OUTPUT
        
        if [[ "$ENVIRONMENT" == "prod" ]]; then
          echo "ACR_NAME=acrhackatonprod2024x7z" >> $GITHUB_OUTPUT
        else
          echo "ACR_NAME=acrhackatondev2024x7z" >> $GITHUB_OUTPUT
        fi
        
    - name: Parse ACR credentials
      id: acr-creds
      run: |
        if [[ "${{ steps.set-env.outputs.ENVIRONMENT }}" == "prod" ]]; then
          echo "username=$(echo '${{ secrets.ACR_PROD }}' | jq -r '.username')" >> $GITHUB_OUTPUT
          echo "password=$(echo '${{ secrets.ACR_PROD }}' | jq -r '.password')" >> $GITHUB_OUTPUT
        else
          echo "username=$(echo '${{ secrets.ACR_DEV }}' | jq -r '.username')" >> $GITHUB_OUTPUT
          echo "password=$(echo '${{ secrets.ACR_DEV }}' | jq -r '.password')" >> $GITHUB_OUTPUT
        fi
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container
      
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ steps.set-env.outputs.ACR_NAME }}.azurecr.io
        username: ${{ steps.acr-creds.outputs.username }}
        password: ${{ steps.acr-creds.outputs.password }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.set-env.outputs.ACR_NAME }}.azurecr.io/${{ env.REPOSITORY_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=${{ steps.set-env.outputs.ENVIRONMENT }}-{{branch}}-
          type=raw,value=${{ steps.set-env.outputs.ENVIRONMENT }}-latest
          type=raw,value=${{ steps.set-env.outputs.ENVIRONMENT }}-{{date 'YYYYMMDD-HHmmss'}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/DockerFile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          ENVIRONMENT=${{ steps.set-env.outputs.ENVIRONMENT }}
          
    - name: Image digest
      run: |
        echo "✅ Build and Push completed successfully!"
        echo "Environment: ${{ steps.set-env.outputs.ENVIRONMENT }}"
        echo "ACR: ${{ steps.set-env.outputs.ACR_NAME }}.azurecr.io"
        echo "Image digest: ${{ steps.meta.outputs.digest }}"
        echo "Image tags: ${{ steps.meta.outputs.tags }}"